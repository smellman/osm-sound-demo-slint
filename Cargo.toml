[package]
name = "osm-sound-demo-slint"
version = "0.1.0"
edition = "2024"

[features]
# No default: a backend has to be named. `maplibre-native-ffi` ships one
# prebuilt native artifact per backend and refuses to have two enabled, so this
# cannot be resolved per target the way it used to be — and defaulting to one
# of them would silently break the platforms it does not suit.
#
#     cargo run --release --features opengl     # Linux, the fast path here
#     cargo run --release --features vulkan     # Linux, for comparison
#     cargo run --release --features metal      # macOS
#
# OpenGL, not Vulkan, on this machine: at 1920x1200 in release on an AMD RENOIR
# integrated GPU the app runs at about 20 fps on OpenGL against 5.9 on Vulkan.
# See "Rendering backend" in the README for the breakdown.
#
# Enabling two is refused at compile time rather than left to the linker.
vulkan = ["maplibre-native-ffi/vulkan", "dep:ash"]
opengl = ["maplibre-native-ffi/opengl", "dep:glutin_egl_sys", "dep:libloading"]
metal = ["maplibre-native-ffi/metal", "dep:objc2", "dep:objc2-metal"]

# Enable Slint's linuxkms backend (libseat-free variant) for console /
# embedded Linux KMS targets (no X11/Wayland).
linuxkms-noseat = ["slint/backend-linuxkms-noseat"]

[dependencies]
gilrs = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback", "recording", "symphonia-mp3"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.16"
ureq = { version = "3", features = ["json"] }

# The FFI hands the graphics plumbing to the caller: the map draws through a
# device this app creates, so each backend brings the crate that creates one.
maplibre-native-ffi = { git = "https://github.com/maplibre/maplibre-native-ffi" }
ash = { version = "0.38", optional = true }
# EGL, for the OpenGL backend. `glutin_egl_sys` is bindings only, so the
# library itself is opened by hand.
glutin_egl_sys = { version = "0.7", optional = true }
libloading = { version = "0.8", optional = true }

# Metal is every Apple platform, not just macOS: the same `metal` feature builds
# for iOS and the simulator (see "iOS" in the README), so gating these on
# `target_os = "macos"` left `metal` naming dependencies that were not there.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.5", optional = true }
objc2-metal = { version = "0.2", features = ["MTLDevice"], optional = true }

# The audio session iOS needs before it will make a sound. cpal pulls this crate
# in already but never sets a category or activates the session, so the app does
# it; see the `session` module in src/audio.rs.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", features = ["AVAudioSession", "AVAudioSessionTypes"] }

[build-dependencies]
slint-build = "1.16"
