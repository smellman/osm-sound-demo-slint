[package]
name = "osm-sound-demo-slint"
version = "0.1.0"
edition = "2024"

[features]
metal = ["maplibre_native/metal"]
opengl = ["maplibre_native/opengl"]
vulkan = ["maplibre_native/vulkan"]
# Enable Slint's linuxkms backend (libseat-free variant) for console /
# embedded Linux KMS targets (no X11/Wayland).
linuxkms-noseat = ["slint/backend-linuxkms-noseat"]

[dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.16"
ureq = { version = "3", features = ["json"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
maplibre_native = { version = "0.8.2", features = ["opengl"] }

[target.'cfg(target_os = "macos")'.dependencies]
maplibre_native = { version = "0.8.2", features = ["metal"] }

[build-dependencies]
slint-build = "1.16"
