[package]
name = "osm-sound-demo-slint"
version = "0.1.0"
edition = "2024"

[features]
# Enable Slint's linuxkms backend (libseat-free variant) for console /
# embedded Linux KMS targets (no X11/Wayland).
linuxkms-noseat = ["slint/backend-linuxkms-noseat"]

[dependencies]
gilrs = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.16"
ureq = { version = "3", features = ["json"] }

# Rendering backend, one per platform. `maplibre_native`'s backend features are
# mutually exclusive, so they are selected per target rather than through our
# own feature flags. The `wgpu` feature is the crate's WebGPU backend: it
# configures MapLibre Native with `MLN_WITH_WEBGPU=ON` and wgpu-native as the
# implementation.
[target.'cfg(not(target_os = "macos"))'.dependencies]
maplibre_native = { version = "0.8.2", features = ["wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
maplibre_native = { version = "0.8.2", features = ["metal"] }

[build-dependencies]
slint-build = "1.16"
