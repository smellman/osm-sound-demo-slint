name: OpenStreetMap Sound Demo
options:
  bundleIdPrefix: org.smellman
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  # The personal team, so the App ID lands in a personal account rather than an
  # employer's. Automatic signing creates the profile on first device build.
  DEVELOPMENT_TEAM: 2ZZ93JSHT3
targets:
  OSMSoundDemo:
    type: application
    platform: iOS
    deploymentTarget: "14.3"
    info:
        path: Info.plist
        properties:
            CFBundleDisplayName: OSM Sound Demo
            # The map runs edge to edge, so the clock and battery are in the
            # way. UIViewControllerBasedStatusBarAppearance has to go off as
            # well, or iOS asks the view controller instead and ignores this.
            UIStatusBarHidden: true
            UIViewControllerBasedStatusBarAppearance: false
            # Landscape only on iPhone. Portrait leaves too little width for
            # the release dropdown to be usable, and the top-right controls run
            # off the edge: they need 470pt and an iPhone gives 440. iOS picks
            # the launch orientation from this list, so restricting it is what
            # makes the app open the right way round.
            #
            # The iPad key has to be spelled out as well. Without it the phone's
            # list applies to both and the iPad loses portrait, which it has the
            # width to use.
            UISupportedInterfaceOrientations:
                - UIInterfaceOrientationLandscapeLeft
                - UIInterfaceOrientationLandscapeRight
            UISupportedInterfaceOrientations~ipad:
                - UIInterfaceOrientationPortrait
                - UIInterfaceOrientationPortraitUpsideDown
                - UIInterfaceOrientationLandscapeLeft
                - UIInterfaceOrientationLandscapeRight
            UILaunchScreen:
                - ImageRespectSafeAreaInsets: false
            NSMicrophoneUsageDescription:
                VJ mode drives the buildings and the style's light from what it hears.
    sources: []
    postCompileScripts:
      - script: |
          ./build_for_ios_with_cargo.bash osm-sound-demo-slint --features metal
        outputFileLists:
            $TARGET_BUILD_DIR/$EXECUTABLE_PATH