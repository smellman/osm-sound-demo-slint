# Pinned so every machine builds with the same rustc, and currently matching the
# toolchain `maplibre-native-ffi` builds its prebuilt artifacts with — its own
# `.config/mise.toml` pins `core:rust` to "1.99.1".
#
# This used to be a hard constraint. Up to the git snapshots this app used
# before moving to the crates.io release, the prebuilt shipped
# `libmln_ffi_platform.a`, a Rust `staticlib` carrying a whole copy of std, and
# `maplibre-native-ffi-sys` linked it into this binary next to our own std. With
# two different rustc versions the non-mangled symbols collided:
#
#     rust-lld: error: duplicate symbol: rust_eh_personality
#
# Since v0.202610.3 the platform layer is the `maplibre-native-ffi-platform`
# crate, which Cargo builds with this toolchain, and no prebuilt in the release
# index lists a Rust archive among its link libraries. So this pin can now move
# on its own; if the duplicate-symbol error ever comes back after an FFI update,
# this is the first place to look.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
