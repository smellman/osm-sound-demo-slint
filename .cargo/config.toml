# Rust's `aarch64-apple-ios` targets an iOS far older than the native library
# does, and the mismatch only surfaces at link time: the MapLibre Native archive
# is built against iOS 14.3 (`CMAKE_OSX_DEPLOYMENT_TARGET` in the FFI repo's
# `_ios-arm64` preset) and calls `___chkstk_darwin`, which libSystem only
# exports from iOS 12 on. Linking with the default left it undefined.
#
# 15.0 rather than 14.3, the library's own, because Xcode 27 refuses anything
# below 15.0 for the app bundle, and this has to match `deploymentTarget` in
# project.yml. A library built for an older iOS links into a newer app as it
# is. Inert on every other platform, and Cargo leaves it alone if the
# environment already sets it.
#
# `MAPLIBRE_NATIVE_C_INSTALL_DIR` deliberately does not live here: the FFI
# build script reads it for whatever target is being built, so a value set once
# would point a macOS or simulator build at the iOS device archive. It belongs
# on the one command that needs it — see "iOS" in the README.
[env]
IPHONEOS_DEPLOYMENT_TARGET = "15.0"
